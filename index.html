<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rêvergrand — 3D Printed Designs</title>
    <meta name="description" content="Rêvergrand — 3D printed objects, accessories and designs. Coming soon.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #0a0a0a;
            color: #f4f4f0;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        .page {
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Ambient glow */
        .glow {
            position: absolute;
            width: 520px;
            height: 520px;
            border-radius: 50%;
            background: radial-gradient(
                circle,
                rgba(255,255,255,0.07) 0%,
                rgba(255,255,255,0.025) 35%,
                transparent 70%
            );
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        /* Header */
        header {
            width: 100%;
            padding: 32px 5vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 10px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: #999;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #f4f4f0;
            box-shadow: 0 0 12px rgba(255,255,255,0.7);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.45;
            }
            50% {
                opacity: 1;
            }
        }

        /* Main */
        main {
            flex: 1;
            min-height: calc(100vh - 150px);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
            padding: 60px 24px 80px;
        }

        .content {
            width: 100%;
            max-width: 900px;
            text-align: center;
            animation: reveal 1.1s ease forwards;
        }

        @keyframes reveal {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .eyebrow {
            font-size: 11px;
            letter-spacing: 0.3em;
            color: #777;
            text-transform: uppercase;
            margin-bottom: 28px;
        }

        h1 {
            font-size: clamp(52px, 10vw, 120px);
            line-height: 0.9;
            font-weight: 500;
            letter-spacing: -0.055em;
            margin-bottom: 30px;
        }

        h1 span {
            display: block;
            color: #666;
        }

        .description {
            max-width: 520px;
            margin: 0 auto;
            color: #999;
            font-size: 15px;
            line-height: 1.8;
            font-weight: 400;
        }

        /* Coming soon */
        .coming-soon {
            margin: 50px auto 42px;
            display: inline-flex;
            align-items: center;
            gap: 15px;
            padding: 14px 20px;
            border: 1px solid #292929;
            border-radius: 100px;
            background: rgba(255,255,255,0.025);
            font-size: 11px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: #ddd;
        }

        .coming-line {
            width: 22px;
            height: 1px;
            background: #555;
        }

        /* Button */
        .instagram {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-width: 190px;
            padding: 15px 24px;
            border-radius: 100px;
            background: #f4f4f0;
            color: #0a0a0a;
            text-decoration: none;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            transition: transform 0.25s ease, opacity 0.25s ease;
        }

        .instagram:hover {
            transform: translateY(-3px);
            opacity: 0.88;
        }

        .instagram svg {
            width: 15px;
            height: 15px;
        }

        /* Decorative 3D layer */
        .print-object {
            position: absolute;
            width: min(28vw, 300px);
            height: min(28vw, 300px);
            right: -100px;
            top: 50%;
            transform: translateY(-50%) rotate(25deg);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 35px;
            opacity: 0.45;
            pointer-events: none;
        }

        .print-object::before,
        .print-object::after {
            content: "";
            position: absolute;
            inset: 18px;
            border: 1px solid rgba(255,255,255,0.055);
            border-radius: 25px;
        }

        .print-object::after {
            inset: 36px;
            border-radius: 18px;
        }

        .print-object-left {
            position: absolute;
            width: min(22vw, 240px);
            height: min(22vw, 240px);
            left: -120px;
            bottom: 5%;
            transform: rotate(-25deg);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 28px;
            opacity: 0.35;
            pointer-events: none;
        }

        /* Footer */
        footer {
            position: relative;
            z-index: 2;
            padding: 24px 5vw 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #555;
            font-size: 9px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        /* Mobile */
        @media (max-width: 600px) {

            header {
                padding: 25px 22px;
            }

            .logo {
                font-size: 16px;
            }

            .status {
                font-size: 8px;
            }

            main {
                padding: 40px 22px 60px;
            }

            h1 {
                font-size: clamp(50px, 17vw, 82px);
            }

            .description {
                font-size: 14px;
                line-height: 1.7;
            }

            .coming-soon {
                margin-top: 40px;
                margin-bottom: 34px;
                font-size: 9px;
                padding: 12px 16px;
            }

            .instagram {
                width: 100%;
                max-width: 250px;
            }

            .print-object {
                width: 220px;
                height: 220px;
                right: -145px;
                opacity: 0.25;
            }

            .print-object-left {
                width: 170px;
                height: 170px;
                left: -115px;
                opacity: 0.2;
            }

            footer {
                padding: 20px 22px 25px;
                font-size: 8px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="glow"></div>

    <div class="print-object"></div>
    <div class="print-object-left"></div>

    <header>
        <div class="logo">Rêvergrand</div>

        <div class="status">
            <span class="dot"></span>
            Store in progress
        </div>
    </header>

    <main>
        <div class="content">

            <div class="eyebrow">
                3D Printing · Objects · Accessories
            </div>

            <h1>
                3D PRINTED.
                <span>DESIGNED TO EXIST.</span>
            </h1>

            <p class="description">
                A new collection of thoughtfully designed objects,
                accessories and everyday pieces — created layer by layer.
            </p>

            <div class="coming-soon">
                <span class="coming-line"></span>
                Coming Soon
                <span class="coming-line"></span>
            </div>

            <a
                class="instagram"
                href="https://www.instagram.com/shoprevergrand/"
                target="_blank"
                rel="noopener noreferrer"
            >
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <rect x="3" y="3" width="18" height="18" rx="5"></rect>
                    <circle cx="12" cy="12" r="4"></circle>
                    <circle cx="17.5" cy="6.5" r="0.8" fill="currentColor"></circle>
                </svg>

                Follow the Journey
            </a>

        </div>
    </main>

    <footer>
        <span>© 2026 Rêvergrand</span>
        <span>Made layer by layer</span>
    </footer>

</div>

</body>
</html>
